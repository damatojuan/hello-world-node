name: Verify and Deploy Node.js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - name: Smoke test HTTP server
        shell: bash
        run: |
          node index.js &
          server_pid=$!
          trap "kill $server_pid" EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:3000/ | grep "Servidor Node.js funcionando."

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured"
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
